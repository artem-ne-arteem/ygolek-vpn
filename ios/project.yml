# Проект Xcode генерируется из этого файла (XcodeGen) — в CI, на облачном Маке.
# Идентификаторы совпадают с профилем подписи, которым подписывается .ipa.
name: YgolekVPN
options:
  bundleIdPrefix: app.vanilla7419
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""

targets:
  YgolekVPN:
    type: application
    platform: iOS
    sources:
      - path: YgolekVPN
    dependencies:
      # VPN-модуль кладётся внутрь приложения (YgolekVPN.app/PlugIns)
      - target: PacketTunnel
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vanilla7419.emerald5335
        CODE_SIGN_ENTITLEMENTS: YgolekVPN/YgolekVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ygolek VPN
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    dependencies:
      # Ядро sing-box, собирается scripts/build-libbox.sh
      - framework: Frameworks/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: NetworkExtension.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vanilla7419.emerald5335.tunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        INFOPLIST_FILE: PacketTunnel/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
